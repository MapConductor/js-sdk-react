buildscript {
  repositories {
    google()
    mavenCentral()
    mavenLocal()
  }
  dependencies {
    classpath "com.android.tools.build:gradle:9.2.1"
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.3.20"
    classpath "org.jetbrains.kotlin:compose-compiler-gradle-plugin:2.3.20"
  }
}

apply plugin: "com.android.library"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "org.jetbrains.kotlin.plugin.compose"

android {
  namespace "com.mapconductor.react"
  compileSdk = rootProject.ext.has("compileSdkVersion") ? rootProject.ext.compileSdkVersion : 35

  defaultConfig {
    minSdk = rootProject.ext.has("minSdkVersion") ? rootProject.ext.minSdkVersion : 24

    externalNativeBuild {
      cmake {
        arguments "-DANDROID_STL=c++_shared"
      }
    }
  }

  buildFeatures {
    compose true
    prefab true
  }

  externalNativeBuild {
    cmake {
      path "src/main/cpp/CMakeLists.txt"
    }
  }
}

repositories {
  mavenLocal()
  google()
  mavenCentral()
}

dependencies {
  implementation "com.facebook.react:react-android"
  implementation "com.facebook.fbjni:fbjni:0.7.0"
  implementation platform("androidx.compose:compose-bom:2025.02.00")
  implementation "androidx.compose.ui:ui"
  api("com.mapconductor:compose:1.3.1")
  // ベクタースタイルは**任意**。`compileOnly` なのは、このモジュールが
  // 全 RN プロバイダの土台で、スタイルを使わないアプリにも 3 ABI 分の
  // ネイティブライブラリ（合わせて約 1.3MB）を背負わせたくないため。
  // 使うアプリはアプリ側の build.gradle で
  // `implementation("com.mapconductor:vectorstyle")` を足す。
  // 無ければ `vectorStyle` prop は診断を 1 本出して何もしない。
  compileOnly("com.mapconductor:vectorstyle:1.3.1")
}
